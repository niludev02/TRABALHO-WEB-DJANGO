{% extends 'template.html' %}

{% block titulo %} Dashboard {% endblock %}

{% block conteudo %}

    <h2>Perfil </h2>
    <p>Nome: <strong>{{ user.first_name }}</strong></p>
    <p>Sobrenome: <strong>{{ user.last_name }}</strong></p>
    <p>Email: <strong>{{ user.email }}</strong></p>

    <form method="post">
        {% csrf_token %}

        <label for="">Nome</label>
        <input type="text" id="" name="first_name" value="{{ user.first_name }}">
        <br><br>

        <label for="">Sobrenome</label>
        <input type="text" id="" name="last_name" value="{{ user.last_name }}">
        <br><br>

        <label for="">E-mail</label>
        <input type="email" id="" name="email" value="{{ user.email }}">
        <br><br>

        <input type="submit" value="Salvar alterações">
    </form> 

    <hr>
    <p><a href="{% url 'alterar_senha' %}">Alterar Senha</a></p>

{% endblock %}
